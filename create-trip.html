<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeTrotter — Plan a Trip</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gt-nav"></div>
<div class="page" style="max-width:640px;">
  <div class="page-header">
    <div>
      <h1>Plan a new trip</h1>
      <p>Start with the basics — you'll add cities and activities next.</p>
    </div>
  </div>

  <div class="card">
    <div id="msg" class="msg hidden"></div>
    <form id="tripForm">
      <div class="field">
        <label>Trip name</label>
        <input type="text" id="name" required placeholder="e.g. Summer in Southeast Asia">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Start date</label>
          <input type="date" id="startDate" required>
        </div>
        <div class="field">
          <label>End date</label>
          <input type="date" id="endDate" required>
        </div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="description" rows="3" placeholder="What's this trip about?"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Cover photo URL (optional)</label>
          <input type="url" id="coverPhoto" placeholder="https://...">
        </div>
        <div class="field">
          <label>Budget limit (optional, USD)</label>
          <input type="number" id="budgetLimit" min="0" placeholder="e.g. 2000">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" type="submit">Save & Build Itinerary</button>
        <a class="btn secondary" href="my-trips.html">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/create-trip.js"></script>
</body>
</html>
