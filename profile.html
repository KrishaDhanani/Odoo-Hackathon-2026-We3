<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeTrotter — Profile</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gt-nav"></div>
<div class="page" style="max-width:560px;">
  <div class="page-header">
    <div>
      <h1>Profile & Settings</h1>
      <p>Manage your account details and preferences.</p>
    </div>
  </div>

  <div id="msg" class="msg hidden"></div>

  <div class="card">
    <form id="profileForm">
      <div class="field">
        <label>Full name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" disabled>
      </div>
      <div class="field">
        <label>Profile photo URL</label>
        <input type="url" id="photo" placeholder="https://...">
      </div>
      <div class="field">
        <label>Language preference</label>
        <select id="language">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="hi">हिन्दी</option>
          <option value="ja">日本語</option>
        </select>
      </div>
      <button class="btn" type="submit">Save Changes</button>
    </form>
  </div>

  <div class="divider"></div>

  <div class="card">
    <h3>Danger zone</h3>
    <p class="text-muted">Deleting your account permanently removes all your trips and data.</p>
    <button class="btn danger" id="deleteAccountBtn">Delete My Account</button>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
