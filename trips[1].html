<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlobeTrotter — My Trips</title>

<style>

:root{
  --primary:#0e7c8c;
  --primary-dark:#0a5f6b;
  --accent:#ff7a59;
  --cyan:#22d3ee;
  --text:#1c2733;
  --muted:#647084;
  --border:#e2e8ee;
  --success:#2e9e5b;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  background:#111a3d;
  overflow-x:hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

.page{
  min-height:100vh;
  position:relative;
  overflow:hidden;

  padding-bottom:100px;

  background:
    linear-gradient(
      180deg,
      #1b2559 0%,
      #3b3b86 22%,
      #754d91 42%,
      #c66b86 61%,
      #ef9a68 80%,
      #f7c875 100%
    );
}


/* STARS */

.stars{
  position:absolute;
  inset:0;
  height:60%;

  background-image:
    radial-gradient(1.5px 1.5px at 8% 20%,#fff,transparent 60%),
    radial-gradient(1.5px 1.5px at 21% 42%,#fff,transparent 60%),
    radial-gradient(1px 1px at 34% 14%,#fff,transparent 60%),
    radial-gradient(1.5px 1.5px at 48% 31%,#fff,transparent 60%),
    radial-gradient(1px 1px at 63% 16%,#fff,transparent 60%),
    radial-gradient(1.5px 1.5px at 77% 35%,#fff,transparent 60%),
    radial-gradient(1px 1px at 91% 17%,#fff,transparent 60%);

  opacity:.7;

  animation:
    starsPulse 5s ease-in-out infinite alternate;
}

@keyframes starsPulse{
  from{
    opacity:.35;
  }
  to{
    opacity:.9;
  }
}


/* CLOUDS */

.cloud{
  position:absolute;

  width:115px;
  height:33px;

  border-radius:50px;

  background:
    rgba(255,255,255,.52);

  z-index:1;
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud::before{
  width:55px;
  height:55px;
  left:12px;
  top:-23px;
}

.cloud::after{
  width:43px;
  height:43px;
  right:10px;
  top:-16px;
}

.cloud.one{
  top:13%;
  left:-160px;
  animation:cloudMove 38s linear infinite;
}

.cloud.two{
  top:35%;
  left:-190px;
  opacity:.42;
  transform:scale(.7);
  animation:cloudMove 52s linear infinite;
  animation-delay:-17s;
}

.cloud.three{
  top:53%;
  left:-160px;
  opacity:.28;
  transform:scale(.55);
  animation:cloudMove 65s linear infinite;
  animation-delay:-30s;
}

@keyframes cloudMove{
  from{
    transform:translateX(0);
  }
  to{
    transform:translateX(135vw);
  }
}


/* =====================================================
   FLIGHT ROUTE
===================================================== */

.flight-route{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}

.flight-route path{
  fill:none;
  stroke:rgba(255,255,255,.38);
  stroke-width:3;
  stroke-dasharray:2 15;
  stroke-linecap:round;
}

.route-dot{
  fill:var(--accent);

  animation:
    routePulse 2s ease-in-out infinite;
}

@keyframes routePulse{
  0%,100%{
    opacity:.6;
    transform:scale(1);
  }
  50%{
    opacity:1;
    transform:scale(1.35);
  }
}


/* PLANE */

.plane{
  position:absolute;
  left:2%;
  top:70%;

  z-index:4;

  font-size:28px;

  animation:
    planeFly 13s cubic-bezier(.45,.05,.35,1) infinite;
}

@keyframes planeFly{

  0%{
    left:2%;
    top:73%;
    transform:rotate(-8deg);
  }

  35%{
    left:34%;
    top:47%;
    transform:rotate(-18deg);
  }

  65%{
    left:66%;
    top:34%;
    transform:rotate(-13deg);
  }

  100%{
    left:103%;
    top:10%;
    transform:rotate(-5deg);
  }
}


/* =====================================================
   HEADER
===================================================== */

.header{
  position:relative;
  z-index:20;

  width:min(1180px,calc(100% - 40px));

  margin:auto;

  padding-top:24px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:11px;
  color:white;
}

.logo{
  width:53px;
  height:53px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:1.7rem;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--accent)
    );

  box-shadow:
    0 12px 30px rgba(14,124,140,.35);

  animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-5px);
  }
}

.logo-text{
  font-size:1.2rem;
  font-weight:800;
}

.logo-text span{
  color:#5ee7f5;
}

.header-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.header-btn{
  border:1px solid rgba(255,255,255,.23);

  color:white;

  background:rgba(255,255,255,.12);

  backdrop-filter:blur(12px);

  border-radius:10px;

  padding:10px 13px;

  font-weight:700;

  transition:.2s;
}

.header-btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.2);
}

.avatar{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--cyan),
      var(--primary)
    );

  color:white;
}


/* =====================================================
   MAIN
===================================================== */

.main{
  position:relative;
  z-index:10;

  width:min(1180px,calc(100% - 40px));

  margin:35px auto 0;
}


/* TITLE */

.page-heading{
  color:white;

  margin-bottom:22px;

  animation:
    headingIn .8s ease forwards;
}

.page-heading h1{
  margin:0;

  font-size:
    clamp(2rem,4vw,3rem);

  letter-spacing:-1px;
}

.page-heading h1 span{
  color:#5ee7f5;
}

.page-heading p{
  margin:8px 0 0;

  color:rgba(255,255,255,.72);

  font-size:.9rem;
}

@keyframes headingIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* =====================================================
   MAIN PANEL
===================================================== */

.panel{
  background:
    rgba(255,255,255,.95);

  border:
    1px solid rgba(255,255,255,.75);

  border-radius:25px;

  padding:23px;

  box-shadow:
    0 35px 90px rgba(8,30,45,.3),
    0 10px 30px rgba(0,0,0,.08);

  backdrop-filter:blur(18px);

  animation:
    panelIn .9s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes panelIn{
  from{
    opacity:0;
    transform:
      translateY(35px)
      scale(.97);
  }
  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  margin-bottom:20px;
}

.tabs{
  display:flex;
  gap:5px;

  padding:4px;

  border-radius:11px;

  background:#f1f5f7;
}

.tab{
  border:0;

  background:transparent;

  color:var(--muted);

  padding:
    9px
    14px;

  border-radius:8px;

  font-size:.72rem;

  font-weight:700;

  transition:.2s;
}

.tab.active{
  color:white;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );

  box-shadow:
    0 5px 12px
    rgba(14,124,140,.2);
}

.tab:hover:not(.active){
  color:var(--primary);
}


/* SEARCH */

.search{
  position:relative;

  width:230px;
}

.search input{
  width:100%;

  padding:
    11px
    12px
    11px
    36px;

  border:
    1px solid
    var(--border);

  border-radius:10px;

  outline:none;

  color:var(--text);

  background:#fbfcfd;
}

.search span{
  position:absolute;

  left:12px;
  top:50%;

  transform:translateY(-50%);

  font-size:.85rem;
}


/* =====================================================
   NEW TRIP BUTTON
===================================================== */

.new-trip{
  width:100%;

  border:0;

  border-radius:15px;

  padding:16px;

  margin-bottom:20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  color:white;

  background:
    linear-gradient(
      110deg,
      var(--primary),
      #1498a9,
      var(--accent)
    );

  background-size:200% 100%;

  box-shadow:
    0 10px 25px
    rgba(14,124,140,.2);

  transition:.3s;

  animation:
    gradientMove 5s ease infinite;
}

@keyframes gradientMove{
  0%,100%{
    background-position:0% 50%;
  }
  50%{
    background-position:100% 50%;
  }
}

.new-trip:hover{
  transform:translateY(-3px);

  box-shadow:
    0 15px 30px
    rgba(14,124,140,.28);
}

.new-trip-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.new-trip-icon{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:
    rgba(255,255,255,.18);

  font-size:1.2rem;
}

.new-trip-text{
  text-align:left;
}

.new-trip-text strong{
  display:block;
  font-size:.85rem;
}

.new-trip-text span{
  display:block;
  margin-top:3px;
  font-size:.65rem;
  opacity:.8;
}

.plus{
  font-size:1.6rem;
}


/* =====================================================
   TRIP GRID
===================================================== */

.trip-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:15px;
}


/* =====================================================
   TRIP CARD
===================================================== */

.trip-card{
  position:relative;

  overflow:hidden;

  border:
    1px solid
    var(--border);

  border-radius:18px;

  background:#fff;

  transition:
    transform .3s ease,
    box-shadow .3s ease;

  animation:
    cardIn .7s ease both;
}

.trip-card:nth-child(1){
  animation-delay:.1s;
}

.trip-card:nth-child(2){
  animation-delay:.2s;
}

.trip-card:nth-child(3){
  animation-delay:.3s;
}

.trip-card:nth-child(4){
  animation-delay:.4s;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.trip-card:hover{
  transform:
    translateY(-7px);

  box-shadow:
    0 18px 35px
    rgba(14,124,140,.12);
}


/* CARD IMAGE */

.trip-cover{
  height:135px;

  position:relative;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:3.2rem;

  background:
    linear-gradient(
      135deg,
      #263069,
      #784d8d,
      #ee926e
    );
}

.trip-cover::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      1.5px 1.5px at 20% 25%,
      white,
      transparent
    ),
    radial-gradient(
      1px 1px at 65% 18%,
      white,
      transparent
    ),
    radial-gradient(
      1.5px 1.5px at 85% 40%,
      white,
      transparent
    );
}

.trip-cover::after{
  content:"";

  position:absolute;

  left:-20%;
  right:-20%;
  bottom:-65px;

  height:110px;

  background:
    rgba(20,25,45,.55);

  border-radius:50%;
}

.trip-emoji{
  position:relative;
  z-index:2;

  filter:
    drop-shadow(
      0 8px 10px
      rgba(0,0,0,.18)
    );

  animation:
    destinationFloat 3s ease-in-out infinite;
}

@keyframes destinationFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-7px);
  }
}


/* STATUS */

.status{
  position:absolute;

  top:11px;
  right:11px;

  z-index:5;

  padding:
    5px
    9px;

  border-radius:20px;

  font-size:.58rem;

  font-weight:800;

  color:white;

  background:
    rgba(14,124,140,.9);

  backdrop-filter:blur(5px);
}

.status.completed{
  background:
    rgba(46,158,91,.9);
}

.status.draft{
  background:
    rgba(100,112,132,.9);
}


/* CARD BODY */

.trip-body{
  padding:15px;
}

.trip-body h3{
  margin:0;

  font-size:.92rem;

  color:var(--text);
}

.country{
  margin-top:4px;

  color:var(--muted);

  font-size:.68rem;
}

.trip-details{
  display:flex;

  justify-content:space-between;

  margin-top:14px;

  padding-top:11px;

  border-top:
    1px solid
    #edf0f3;
}

.detail{
  color:var(--muted);

  font-size:.61rem;
}

.detail strong{
  display:block;

  color:var(--text);

  margin-top:3px;

  font-size:.68rem;
}


/* CARD FOOTER */

.card-footer{
  display:flex;

  gap:7px;

  margin-top:13px;
}

.card-btn{
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  border-radius:8px;

  padding:9px;

  font-size:.66rem;

  font-weight:700;

  text-align:center;

  text-decoration:none;

  transition:.2s;
}

.view-btn{
  color:var(--primary);

  background:#eef8f9;
}

.edit-btn{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );
}

.delete-btn{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      #e35d5d,
      #b83b3b
    );
}

.card-btn:hover{
  transform:translateY(-2px);
}


/* =====================================================
   EMPTY / ADD CARD
===================================================== */

.add-card{
  min-height:300px;

  border:
    2px dashed
    #d7e0e5;

  border-radius:18px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:20px;

  color:var(--muted);

  transition:.3s;

  cursor:pointer;
}

.add-card:hover{
  border-color:var(--primary);

  background:#f8fcfd;

  transform:translateY(-4px);
}

.add-icon{
  width:58px;
  height:58px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:var(--primary);

  background:#eaf7f9;

  font-size:1.5rem;

  margin-bottom:12px;

  transition:.3s;
}

.add-card:hover .add-icon{
  transform:
    rotate(90deg)
    scale(1.08);
}

.add-card strong{
  color:var(--text);

  font-size:.85rem;
}

.add-card span{
  max-width:190px;

  margin-top:5px;

  font-size:.66rem;

  line-height:1.5;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary{
  margin-top:20px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.summary-box{
  padding:14px;

  border-radius:14px;

  background:#f8fafc;

  border:
    1px solid
    var(--border);
}

.summary-box small{
  color:var(--muted);

  font-size:.62rem;
}

.summary-box strong{
  display:block;

  margin-top:4px;

  color:var(--text);

  font-size:1.1rem;
}


/* =====================================================
   MOUNTAINS
===================================================== */

.mountains{
  position:absolute;

  left:0;
  right:0;

  bottom:45px;

  height:145px;

  z-index:2;

  background:
    linear-gradient(
      180deg,
      rgba(15,22,45,.28),
      rgba(10,16,32,.86)
    );

  clip-path:
    polygon(
      0 100%,
      0 62%,
      10% 38%,
      20% 58%,
      31% 15%,
      43% 51%,
      54% 30%,
      66% 61%,
      78% 21%,
      89% 48%,
      100% 32%,
      100% 100%
    );
}


/* ROAD */

.road{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:45px;

  z-index:3;

  background:
    linear-gradient(
      180deg,
      #252d3b,
      #11151d
    );
}

.road::before{
  content:"";

  position:absolute;

  left:0;
  right:0;

  top:50%;

  height:4px;

  transform:translateY(-50%);

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.6) 0 22px,
      transparent 22px 46px
    );

  animation:
    roadMove 1s linear infinite;
}

@keyframes roadMove{
  to{
    background-position:-46px 0;
  }
}

.car{
  position:absolute;

  bottom:5px;

  font-size:1.35rem;

  animation:
    carMove 11s linear infinite;
}

.bus{
  position:absolute;

  bottom:24px;

  font-size:1.45rem;

  animation:
    carMove 16s linear infinite;
}

@keyframes carMove{
  from{
    transform:translateX(-120px);
  }

  to{
    transform:translateX(110vw);
  }
}


/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(9,18,40,.65);

  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;

  animation:
    modalFade .25s ease;
}

@keyframes modalFade{
  from{
    opacity:0;
  }
  to{
    opacity:1;
  }
}

.modal-box{
  width:min(480px,100%);

  background:white;

  border-radius:20px;

  padding:24px;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.3);

  animation:
    modalIn .35s cubic-bezier(.16,1,.3,1);
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:
      translateY(20px)
      scale(.95);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}

.modal-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.modal-header h2{
  margin:0;

  font-size:1.15rem;
}

.close{
  width:35px;
  height:35px;

  border:0;

  border-radius:50%;

  background:#f1f4f6;

  color:var(--text);

  font-size:1.1rem;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;

  margin-bottom:6px;

  color:var(--text);

  font-size:.68rem;

  font-weight:700;
}

.form-group input,
.form-group select{
  width:100%;

  padding:11px;

  border:
    1px solid
    var(--border);

  border-radius:9px;

  outline:none;

  color:var(--text);

  background:#fbfcfd;
}

.form-group input:focus,
.form-group select:focus{
  border-color:var(--primary);

  box-shadow:
    0 0 0 3px
    rgba(14,124,140,.08);
}

.create-btn{
  width:100%;

  border:0;

  border-radius:10px;

  padding:12px;

  color:white;

  font-weight:700;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:950px){

  .trip-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .summary{
    grid-template-columns:
      repeat(3,1fr);
  }
}


@media(max-width:700px){

  .header{
    width:calc(100% - 25px);
  }

  .main{
    width:calc(100% - 25px);
  }

  .logo-text{
    font-size:1rem;
  }

  .header-btn{
    display:none;
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .tabs{
    width:100%;
    overflow:auto;
  }

  .tab{
    flex:1;
    white-space:nowrap;
  }

  .search{
    width:100%;
  }

  .trip-grid{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .panel{
    padding:14px;
    border-radius:20px;
  }

  .trip-cover{
    height:155px;
  }

  .mountains{
    height:90px;
    bottom:40px;
  }

  .road{
    height:40px;
  }
}


@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }
}

</style>
</head>


<body>

<div class="page">


  <!-- BACKGROUND -->

  <div class="stars"></div>

  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="cloud three"></div>


  <!-- FLIGHT ROUTE -->

  <svg
    class="flight-route"
    viewBox="0 0 1600 900"
    preserveAspectRatio="xMidYMid slice"
  >

    <path
      d="
        M70 770
        C400 350
        1000 300
        1530 110
      "
    />

    <circle
      class="route-dot"
      cx="70"
      cy="770"
      r="9"
    />

    <circle
      class="route-dot"
      cx="1530"
      cy="110"
      r="9"
    />

  </svg>


  <div class="plane">
    ✈️
  </div>


  <!-- HEADER -->

  <header class="header">

    <div class="logo-area">

      <div class="logo">
        🌍
      </div>

      <div class="logo-text">
        Globe<span>Trotter</span>
      </div>

    </div>


    <div class="header-right">

      <button
        class="header-btn"
        onclick="goDashboard()"
      >
        ← Dashboard
      </button>

      <button
        class="header-btn"
        onclick="alert('Notifications coming soon 🔔')"
      >
        🔔
      </button>

      <div class="avatar">
        👤
      </div>

    </div>

  </header>


  <!-- MAIN -->

  <main class="main">


    <section class="page-heading">

      <h1>
        My <span>Trips</span> 🧳
      </h1>

      <p>
        Plan, manage and explore all your adventures in one place.
      </p>

    </section>


    <!-- PANEL -->

    <section class="panel">


      <!-- TOOLBAR -->

      <div class="toolbar">

        <div class="tabs">

          <button
            class="tab active"
            onclick="filterTrips('all',this)"
          >
            All Trips
          </button>

          <button
            class="tab"
            onclick="filterTrips('upcoming',this)"
          >
            Upcoming
          </button>

          <button
            class="tab"
            onclick="filterTrips('completed',this)"
          >
            Completed
          </button>

        </div>


        <div class="search">

          <span>
            🔍
          </span>

          <input
            type="text"
            id="searchInput"
            placeholder="Search destination..."
            oninput="searchTrips()"
          >

        </div>

      </div>


      <!-- CREATE TRIP -->

      <button
        class="new-trip"
        onclick="openModal()"
      >

        <div class="new-trip-left">

          <div class="new-trip-icon">
            ✈️
          </div>

          <div class="new-trip-text">

            <strong>
              Plan a New Adventure
            </strong>

            <span>
              Create your next unforgettable trip
            </span>

          </div>

        </div>

        <div class="plus">
          +
        </div>

      </button>


      <!-- TRIPS -->

      <div
        class="trip-grid"
        id="tripGrid"
      >

        <!-- populated by loadTrips() / renderTrips() -->

      </div>


      <!-- SUMMARY -->

      <div class="summary">

        <div class="summary-box">

          <small>
            Total Trips
          </small>

          <strong id="statTotalTrips">
            00
          </strong>

        </div>

        <div class="summary-box">

          <small>
            Upcoming
          </small>

          <strong id="statUpcoming">
            00
          </strong>

        </div>

        <div class="summary-box">

          <small>
            Total Nights
          </small>

          <strong id="statNights">
            00
          </strong>

        </div>

      </div>


    </section>

  </main>


  <!-- MOUNTAINS -->

  <div class="mountains"></div>


  <!-- ROAD -->

  <div class="road">

    <div class="bus">
      🚌
    </div>

    <div class="car">
      🚗
    </div>

  </div>


</div>


<!-- =====================================================
     CREATE TRIP MODAL
===================================================== -->

<div
  class="modal"
  id="tripModal"
  onclick="closeOutside(event)"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        ✈️ Plan New Trip
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div class="form-group">

      <label>
        Trip Title
      </label>

      <input
        type="text"
        id="destination"
        placeholder="e.g. Switzerland Getaway"
      >

    </div>


    <div class="form-group">

      <label>
        Description
      </label>

      <input
        type="text"
        id="tripDescription"
        placeholder="e.g. Hiking and lake towns"
      >

    </div>


    <div class="form-group">

      <label>
        Travel Date
      </label>

      <input
        type="date"
        id="travelDate"
      >

    </div>


    <div class="form-group">

      <label>
        Duration
      </label>

      <select id="duration">

        <option>
          3 Nights
        </option>

        <option>
          5 Nights
        </option>

        <option>
          7 Nights
        </option>

        <option>
          10 Nights
        </option>

        <option>
          14 Nights
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Budget
      </label>

      <input
        type="number"
        id="budget"
        placeholder="e.g. 1500"
      >

    </div>


    <button
      class="create-btn"
      onclick="createTrip()"
    >
      Create Trip ✈️
    </button>

  </div>

</div>

<script src="app-api.js"></script>

<script>

API.requireAuth();

document.addEventListener("DOMContentLoaded", loadTrips);


/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard(){

  window.location.href =
    "dashboard.html";

}


/* =====================================================
   MODAL
===================================================== */

function openModal(){

  document
    .getElementById("tripModal")
    .classList.add("show");

  setTimeout(() => {

    document
      .getElementById("destination")
      .focus();

  },200);

}


function closeModal(){

  document
    .getElementById("tripModal")
    .classList.remove("show");

}


function closeOutside(event){

  if(
    event.target.id ===
    "tripModal"
  ){

    closeModal();

  }

}


/* =====================================================
   TRIP DATA
===================================================== */

let allTrips = [];
let currentFilter = "all";


async function loadTrips(){

  try{

    const data =
      await API.get("/api/trips");

    allTrips =
      data.trips || [];

  }catch(error){

    allTrips = [];

  }

  renderTrips();
  updateSummary();

}


function escapeHtml(value){

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

}


function nightsBetween(start, end){

  if(!start || !end) return null;

  const diff =
    (new Date(end) - new Date(start)) /
    (1000 * 60 * 60 * 24);

  return diff > 0 ? Math.round(diff) : 0;

}


function formatDateRange(start, end){

  if(!start && !end) return "Not set";

  const opts = { day: "2-digit", month: "short" };

  const startLabel =
    start
      ? new Date(start).toLocaleDateString("en-GB", opts)
      : "?";

  const endLabel =
    end
      ? new Date(end).toLocaleDateString("en-GB", opts)
      : "?";

  return startLabel + " – " + endLabel;

}


function statusGroup(trip){

  const status =
    (trip.status || "planned").toLowerCase();

  return status === "completed" ? "completed" : "upcoming";

}


function tripCardHTML(trip){

  const status =
    (trip.status || "planned").toLowerCase();

  const group = statusGroup(trip);

  const badgeClass =
    status === "completed"
      ? "completed"
      : (status === "draft" ? "draft" : "");

  const badgeLabel =
    status.charAt(0).toUpperCase() + status.slice(1);

  const dateRange =
    formatDateRange(trip.start_date, trip.end_date);

  const nights =
    nightsBetween(trip.start_date, trip.end_date);

  const currency = trip.currency || "INR";

  const budget =
    Number(trip.budget || 0).toLocaleString();

  const emoji = trip.cover_emoji || "🌍";

  const name =
    (trip.title || "").toLowerCase() +
    " " +
    (trip.description || "").toLowerCase();

  return (
    '<article class="trip-card" data-status="' + group + '" data-name="' + escapeHtml(name) + '">' +
      '<div class="trip-cover">' +
        '<span class="trip-emoji">' + emoji + '</span>' +
        '<span class="status ' + badgeClass + '">' + escapeHtml(badgeLabel) + '</span>' +
      '</div>' +
      '<div class="trip-body">' +
        '<h3>' + escapeHtml(trip.title || "Untitled trip") + '</h3>' +
        '<div class="country">' + escapeHtml(trip.description || "No description yet") + '</div>' +
        '<div class="trip-details">' +
          '<div class="detail">Dates<strong>' + dateRange + '</strong></div>' +
          '<div class="detail">Duration<strong>' + (nights !== null ? nights + " Nights" : "-") + '</strong></div>' +
          '<div class="detail">Budget<strong>' + escapeHtml(currency) + " " + budget + '</strong></div>' +
        '</div>' +
        '<div class="card-footer">' +
          '<a class="card-btn view-btn" href="trip-overview.html?id=' + trip.id + '">View</a>' +
          '<button class="card-btn delete-btn" onclick="deleteTrip(' + trip.id + ', event)">Delete</button>' +
        '</div>' +
      '</div>' +
    '</article>'
  );

}


function addCardHTML(){

  return (
    '<div class="add-card" onclick="openModal()">' +
      '<div class="add-icon">+</div>' +
      '<strong>Add another trip</strong>' +
      '<span>Start planning your next destination and make new memories.</span>' +
    '</div>'
  );

}


function emptyStateHTML(message, subtext){

  return (
    '<div class="add-card" onclick="openModal()" style="grid-column:1/-1;">' +
      '<div class="add-icon">+</div>' +
      '<strong>' + escapeHtml(message) + '</strong>' +
      '<span>' + escapeHtml(subtext) + '</span>' +
    '</div>'
  );

}


function renderTrips(){

  const grid =
    document.getElementById("tripGrid");

  if(allTrips.length === 0){

    grid.innerHTML =
      emptyStateHTML(
        "No trips yet",
        "Plan your first one! Click here to get started."
      );

    return;

  }

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    allTrips.filter(trip => {

      const filterMatch =
        currentFilter === "all" ||
        statusGroup(trip) === currentFilter;

      const name =
        (trip.title || "").toLowerCase() +
        " " +
        (trip.description || "").toLowerCase();

      const searchMatch =
        name.includes(search);

      return filterMatch && searchMatch;

    });

  if(filtered.length === 0){

    grid.innerHTML =
      emptyStateHTML(
        "No matching trips",
        "Try a different search or filter."
      );

    return;

  }

  grid.innerHTML =
    filtered.map(tripCardHTML).join("") +
    addCardHTML();

}


function updateSummary(){

  const total = allTrips.length;

  const upcoming =
    allTrips.filter(
      trip => statusGroup(trip) === "upcoming"
    ).length;

  const nights =
    allTrips.reduce(
      (sum, trip) =>
        sum + (nightsBetween(trip.start_date, trip.end_date) || 0),
      0
    );

  const totalEl = document.getElementById("statTotalTrips");
  const upcomingEl = document.getElementById("statUpcoming");
  const nightsEl = document.getElementById("statNights");

  if(totalEl) totalEl.textContent = String(total).padStart(2, "0");
  if(upcomingEl) upcomingEl.textContent = String(upcoming).padStart(2, "0");
  if(nightsEl) nightsEl.textContent = String(nights).padStart(2, "0");

}


/* =====================================================
   CREATE TRIP
===================================================== */

function resetModalForm(){

  document.getElementById("destination").value = "";
  document.getElementById("tripDescription").value = "";
  document.getElementById("travelDate").value = "";
  document.getElementById("duration").selectedIndex = 0;
  document.getElementById("budget").value = "";

}


async function createTrip(){

  const title =
    document
      .getElementById("destination")
      .value
      .trim();

  const description =
    document
      .getElementById("tripDescription")
      .value
      .trim();

  const startDate =
    document
      .getElementById("travelDate")
      .value;

  const duration =
    document
      .getElementById("duration")
      .value;

  const budget =
    document
      .getElementById("budget")
      .value;


  if(!title){

    alert(
      "Please enter a trip title 🌍"
    );

    return;

  }


  const nights =
    parseInt(duration, 10) || 0;

  let endDate = "";

  if(startDate && nights){

    const end = new Date(startDate);
    end.setDate(end.getDate() + nights);
    endDate = end.toISOString().slice(0, 10);

  }

  try{

    const data =
      await API.post("/api/trips", {
        title: title,
        description: description,
        start_date: startDate || null,
        end_date: endDate || null,
        budget: budget ? Number(budget) : 0
      });

    allTrips.unshift(data.trip);

    renderTrips();
    updateSummary();

    closeModal();
    resetModalForm();

  }catch(error){

    alert(error.message);

  }

}


/* =====================================================
   DELETE TRIP
===================================================== */

async function deleteTrip(id, event){

  if(event) event.stopPropagation();

  if(!confirm("Delete this trip?")) return;

  try{

    await API.del("/api/trips/" + id);

    allTrips =
      allTrips.filter(
        trip => Number(trip.id) !== Number(id)
      );

    renderTrips();
    updateSummary();

  }catch(error){

    alert(error.message);

  }

}


/* =====================================================
   FILTER
===================================================== */

function filterTrips(
  filter,
  button
){

  currentFilter =
    filter;


  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  renderTrips();

}


/* =====================================================
   SEARCH
===================================================== */

function searchTrips(){

  renderTrips();

}


/* =====================================================
   ESC CLOSE
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeModal();

    }

  }
);


</script>

</body>
</html>
