<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GlobeTrotter — Login</title>


<style>

:root{
  --primary:#0e7c8c;
  --primary-dark:#0a5f6b;
  --accent:#ff7a59;
  --text:#1c2733;
  --muted:#647084;
  --border:#e2e8ee;
  --danger:#d9534f;
  --success:#2e9e5b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  background:#101936;
}

button,
input{
  font-family:inherit;
}

a{
  color:var(--primary);
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}

.hidden{
  display:none!important;
}


/* =========================
   INTRO
========================= */

.intro{

  position:fixed;
  inset:0;
  z-index:100;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(77,189,207,.18),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #080f2b 0%,
      #121d50 35%,
      #30245e 65%,
      #e16f79 100%
    );

  animation:
    introExit .9s ease forwards;

  animation-delay:3.35s;
}

.intro-bg{
  position:absolute;
  inset:0;
}

.intro-stars{

  position:absolute;
  inset:0;

  background-image:
    radial-gradient(
      2px 2px at 8% 15%,
      #fff,
      transparent 70%
    ),
    radial-gradient(
      1px 1px at 17% 70%,
      #fff,
      transparent 70%
    ),
    radial-gradient(
      2px 2px at 28% 25%,
      #fff,
      transparent 70%
    ),
    radial-gradient(
      1px 1px at 37% 75%,
      #fff,
      transparent 70%
    ),
    radial-gradient(
      2px 2px at 49% 14%,
      #fff,
      transparent 70%
    ),
    radial-gradient(
      1px 1px at 59% 67%,
      #fff,
      transparent 70%
    ),
    radial-gradient(
      2px 2px at 70% 27%,
      #fff,
      transparent 70%
    ),
    radial-gradient(
      1px 1px at 82% 73%,
      #fff,
      transparent 70%
    ),
    radial-gradient(
      2px 2px at 92% 18%,
      #fff,
      transparent 70%
    );

  opacity:.7;

  animation:
    starsMove 3s ease-in-out infinite alternate;
}

@keyframes starsMove{

  from{
    opacity:.35;
    transform:scale(1);
  }

  to{
    opacity:.9;
    transform:scale(1.04);
  }

}

.intro-content{

  position:relative;
  z-index:5;

  text-align:center;

  color:#fff;
}

.intro-globe{

  width:115px;
  height:115px;

  margin:
    0 auto 25px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:4.2rem;

  background:
    radial-gradient(
      circle at 30% 25%,
      #4bd1e3,
      #087487 55%,
      #073d59
    );

  box-shadow:
    0 0 0 10px
      rgba(34,211,238,.08),
    0 0 60px
      rgba(34,211,238,.45),
    inset -15px -15px 30px
      rgba(0,0,0,.25);

  animation:
    globeIn .8s
      cubic-bezier(.17,.84,.44,1)
      forwards,
    globeFloat 2s ease-in-out
      1s infinite;

  transform:scale(0);
}

@keyframes globeIn{

  0%{
    transform:
      scale(0)
      rotate(-90deg);
    opacity:0;
  }

  70%{
    transform:
      scale(1.1)
      rotate(10deg);
    opacity:1;
  }

  100%{
    transform:
      scale(1)
      rotate(0);
    opacity:1;
  }

}

@keyframes globeFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-9px);
  }

}

.intro-title{

  margin:0;

  font-size:
    clamp(
      2.2rem,
      6vw,
      4.5rem
    );

  letter-spacing:4px;

  font-weight:800;

  opacity:0;

  transform:
    translateY(25px);

  animation:
    titleIn .8s ease forwards;

  animation-delay:.55s;
}

.intro-title span{
  color:#5ee7f5;
}

@keyframes titleIn{

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.intro-subtitle{

  margin:
    12px 0 0;

  font-size:
    clamp(
      .9rem,
      2vw,
      1.15rem
    );

  letter-spacing:3px;

  color:
    rgba(255,255,255,.72);

  opacity:0;

  animation:
    subtitleIn .8s ease forwards;

  animation-delay:1.1s;
}

@keyframes subtitleIn{

  from{
    opacity:0;
    letter-spacing:10px;
  }

  to{
    opacity:1;
    letter-spacing:3px;
  }

}

.intro-route{

  position:absolute;

  width:100%;
  height:100%;

  inset:0;
}

.route-line{

  fill:none;

  stroke:
    rgba(255,255,255,.35);

  stroke-width:2;

  stroke-dasharray:
    3 13;

  stroke-linecap:round;
}

.route-plane{
  font-size:34px;
}

.intro-plane{

  position:absolute;

  left:-80px;
  top:62%;

  font-size:2rem;

  animation:
    planeAcross
    3.1s
    cubic-bezier(.35,.05,.3,1)
    .3s forwards;
}

@keyframes planeAcross{

  0%{
    left:-80px;
    top:70%;
    transform:rotate(-8deg);
  }

  45%{
    left:45%;
    top:28%;
    transform:rotate(-18deg);
  }

  100%{
    left:110%;
    top:48%;
    transform:rotate(10deg);
  }

}

.intro-cloud{

  position:absolute;

  width:130px;
  height:35px;

  background:
    rgba(255,255,255,.1);

  border-radius:50px;

  filter:blur(1px);
}

.intro-cloud::before,
.intro-cloud::after{

  content:"";

  position:absolute;

  background:inherit;

  border-radius:50%;
}

.intro-cloud::before{

  width:60px;
  height:60px;

  top:-25px;
  left:15px;
}

.intro-cloud::after{

  width:48px;
  height:48px;

  top:-18px;
  right:18px;
}

.cloud-a{

  top:25%;
  left:-160px;

  animation:
    cloudAcross 9s linear infinite;
}

.cloud-b{

  top:68%;
  left:-200px;

  transform:scale(.7);

  animation:
    cloudAcross 12s linear infinite;

  animation-delay:-4s;
}

@keyframes cloudAcross{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(130vw);
  }

}

.intro-loading{

  position:absolute;

  bottom:11%;
  left:50%;

  transform:
    translateX(-50%);

  width:180px;
  height:3px;

  overflow:hidden;

  border-radius:10px;

  background:
    rgba(255,255,255,.15);
}

.intro-loading::after{

  content:"";

  position:absolute;

  left:-40%;
  top:0;

  width:40%;
  height:100%;

  background:#5ee7f5;

  box-shadow:
    0 0 12px #5ee7f5;

  animation:
    loading 3s linear forwards;
}

@keyframes loading{

  from{
    left:-40%;
  }

  to{
    left:100%;
  }

}

@keyframes introExit{

  0%{
    opacity:1;
    transform:scale(1);
    visibility:visible;
  }

  70%{
    opacity:1;
    transform:scale(1);
  }

  100%{
    opacity:0;
    transform:scale(1.08);
    visibility:hidden;
    pointer-events:none;
  }

}


/* =========================
   LOGIN
========================= */

.login-page{

  min-height:100vh;

  position:relative;

  overflow:hidden;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:30px;

  background:
    linear-gradient(
      180deg,
      #1b2559 0%,
      #3a3a86 22%,
      #7a4f93 42%,
      #c96b86 60%,
      #f2a15f 78%,
      #f7c873 100%
    );
}

.login-background{

  position:absolute;
  inset:0;

  overflow:hidden;
}

.login-stars{

  position:absolute;

  inset:0;

  height:50%;

  background-image:
    radial-gradient(
      1.5px 1.5px at 8% 20%,
      #fff,
      transparent 60%
    ),
    radial-gradient(
      1.5px 1.5px at 22% 45%,
      #fff,
      transparent 60%
    ),
    radial-gradient(
      1px 1px at 38% 15%,
      #fff,
      transparent 60%
    ),
    radial-gradient(
      1.5px 1.5px at 55% 30%,
      #fff,
      transparent 60%
    ),
    radial-gradient(
      1px 1px at 68% 12%,
      #fff,
      transparent 60%
    ),
    radial-gradient(
      1.5px 1.5px at 82% 38%,
      #fff,
      transparent 60%
    ),
    radial-gradient(
      1px 1px at 92% 18%,
      #fff,
      transparent 60%
    );

  opacity:.7;
}

.login-cloud{

  position:absolute;

  width:100px;
  height:30px;

  background:
    rgba(255,255,255,.75);

  border-radius:50px;
}

.login-cloud::before,
.login-cloud::after{

  content:"";

  position:absolute;

  background:inherit;

  border-radius:50%;
}

.login-cloud::before{

  width:48px;
  height:48px;

  top:-20px;
  left:10px;
}

.login-cloud::after{

  width:38px;
  height:38px;

  top:-14px;
  right:10px;
}

.login-cloud.one{

  top:14%;
  left:-120px;

  animation:
    loginCloud 35s linear infinite;
}

.login-cloud.two{

  top:30%;
  left:-160px;

  transform:scale(.7);

  opacity:.5;

  animation:
    loginCloud 50s linear infinite;

  animation-delay:-15s;
}

@keyframes loginCloud{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(130vw);
  }

}

.login-route{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;
}

.login-mountains{

  position:absolute;

  left:0;
  right:0;

  bottom:55px;

  height:140px;

  background:
    linear-gradient(
      180deg,
      rgba(15,22,45,.3),
      rgba(10,16,32,.8)
    );

  clip-path:
    polygon(
      0 100%,
      0 62%,
      10% 38%,
      20% 58%,
      31% 15%,
      43% 51%,
      54% 30%,
      66% 61%,
      78% 21%,
      89% 48%,
      100% 32%,
      100% 100%
    );
}

.login-road{

  position:absolute;

  left:0;
  right:0;

  bottom:0;

  height:55px;

  background:
    linear-gradient(
      180deg,
      #232c3a,
      #12161e
    );
}

.login-road::before{

  content:"";

  position:absolute;

  left:0;
  right:0;

  top:50%;

  height:4px;

  transform:
    translateY(-50%);

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.6) 0 22px,
      transparent 22px 46px
    );

  animation:
    roadMove 1s linear infinite;
}

@keyframes roadMove{

  to{
    background-position:-46px 0;
  }

}

.car{

  position:absolute;

  bottom:6px;

  font-size:1.4rem;

  animation:
    carMove 10s linear infinite;
}

.bus{

  position:absolute;

  bottom:27px;

  font-size:1.6rem;

  animation:
    carMove 15s linear infinite;
}

@keyframes carMove{

  from{
    transform:translateX(-100px);
  }

  to{
    transform:translateX(110vw);
  }

}


/* =========================
   CARD
========================= */

.login-card{

  position:relative;

  z-index:10;

  width:100%;
  max-width:410px;

  padding:34px 32px;

  background:
    rgba(255,255,255,.97);

  border:
    1px solid
    rgba(255,255,255,.65);

  border-radius:22px;

  box-shadow:
    0 30px 80px
      rgba(8,30,45,.35),
    0 10px 35px
      rgba(0,0,0,.1);

  opacity:0;

  transform:
    translateX(120px)
    translateY(20px)
    rotate(3deg);

  animation:
    cardReveal 1s
    cubic-bezier(.16,1,.3,1)
    forwards;

  animation-delay:3.55s;
}

@keyframes cardReveal{

  0%{
    opacity:0;

    transform:
      translateX(120px)
      translateY(20px)
      rotate(3deg);
  }

  65%{
    opacity:1;

    transform:
      translateX(-8px)
      translateY(0)
      rotate(-.5deg);
  }

  100%{
    opacity:1;

    transform:
      translateX(0)
      translateY(0)
      rotate(0);
  }

}

.logo{

  width:62px;
  height:62px;

  margin:
    0 auto 12px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  font-size:1.8rem;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--accent)
    );

  box-shadow:
    0 10px 25px
      rgba(14,124,140,.3);
}

.login-card h1{

  margin:0;

  text-align:center;

  font-size:1.7rem;
}

.subtitle{

  margin:
    6px 0 18px;

  text-align:center;

  color:var(--muted);

  font-size:.92rem;
}

.mini-route{

  display:flex;

  align-items:center;

  gap:5px;

  margin-bottom:20px;
}

.route-dot{

  width:8px;
  height:8px;

  flex-shrink:0;

  border-radius:50%;
}

.route-dot.start{
  background:var(--accent);
}

.route-dot.end{
  background:#22d3ee;
}

.mini-route .route-line{

  flex:1;

  border-top:
    2px dashed
    var(--border);
}

.route-icon{

  font-size:1rem;

  animation:
    routeBob 2s
    ease-in-out infinite;
}

@keyframes routeBob{

  50%{
    transform:translateY(-3px);
  }

}

.field{

  margin-bottom:16px;
}

.field label{

  display:block;

  margin-bottom:7px;

  color:var(--muted);

  font-size:.84rem;

  font-weight:600;
}

.field input{

  width:100%;

  padding:
    12px 14px;

  border:
    1.5px solid
    var(--border);

  border-radius:10px;

  outline:none;

  background:#f9fbfc;

  color:var(--text);

  font-size:.95rem;

  transition:.2s ease;
}

.field input:focus{

  border-color:
    var(--primary);

  background:#fff;

  box-shadow:
    0 0 0 4px
    rgba(14,124,140,.12);
}

.login-btn{

  width:100%;

  border:0;

  border-radius:11px;

  padding:13px;

  color:#fff;

  font-size:1rem;

  font-weight:700;

  cursor:pointer;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );

  box-shadow:
    0 10px 22px
      rgba(14,124,140,.3);

  transition:.2s ease;
}

.login-btn:hover{

  transform:translateY(-2px);

  box-shadow:
    0 15px 28px
      rgba(14,124,140,.4);
}

.login-btn:active{
  transform:scale(.98);
}

.forgot{

  margin:
    11px 0 0;

  text-align:center;

  font-size:.84rem;
}

.message{

  padding:
    10px 13px;

  margin-bottom:14px;

  border-radius:9px;

  font-size:.88rem;
}

.message.error{

  color:var(--danger);

  background:#fdecea;
}

.message.success{

  color:var(--success);

  background:#e9f7ee;
}

.divider{

  position:relative;

  height:0;

  margin:25px 0;

  border-top:
    2px dashed
    var(--border);
}

.divider::after{

  content:"✈";

  position:absolute;

  top:50%;
  left:50%;

  width:27px;
  height:27px;

  transform:
    translate(-50%,-50%);

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    var(--border);

  border-radius:50%;

  background:#fff;

  color:var(--primary);

  font-size:.8rem;
}

.switch{

  text-align:center;

  font-size:.9rem;
}

.demo{

  text-align:center;

  margin:
    14px 0 0;
}

.demo span{

  display:inline-block;

  padding:
    6px 12px;

  border-radius:20px;

  background:#eef2f5;

  color:var(--muted);

  font-size:.75rem;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .login-page{
    padding:18px;
  }

  .login-card{

    max-width:390px;

    padding:
      28px 22px;
  }

  .intro-globe{

    width:90px;
    height:90px;

    font-size:3.2rem;
  }

  .intro-title{

    font-size:2.2rem;

    letter-spacing:2px;
  }

  .intro-subtitle{

    font-size:.8rem;

    letter-spacing:2px;
  }

  .intro-plane{
    font-size:1.5rem;
  }

  .login-mountains{

    height:90px;

    bottom:45px;
  }

  .login-road{
    height:45px;
  }

  .login-card h1{
    font-size:1.5rem;
  }

}

</style>

</head>


<body>


<!-- =========================
     INTRO ANIMATION
========================= -->

<div class="intro">

  <div class="intro-bg">

    <div class="intro-stars"></div>

    <div class="intro-cloud cloud-a"></div>

    <div class="intro-cloud cloud-b"></div>


    <svg
      class="intro-route"
      viewBox="0 0 1600 900"
      preserveAspectRatio="xMidYMid slice"
    >

      <path
        class="route-line"
        d="M100 700 C400 180 950 700 1500 180"
      />

      <text
        class="route-plane"
        text-anchor="middle"
        dominant-baseline="middle"
      >

        ✈

        <animateMotion
          dur="3s"
          begin=".3s"
          repeatCount="1"
          rotate="auto"
          path="M100 700 C400 180 950 700 1500 180"
        />

      </text>

    </svg>


    <div class="intro-plane">
      ✈️
    </div>

  </div>


  <div class="intro-content">

    <div class="intro-globe">
      🌍
    </div>

    <h1 class="intro-title">
      Globe<span>Trotter</span>
    </h1>

    <p class="intro-subtitle">
      YOUR JOURNEY STARTS HERE
    </p>

  </div>


  <div class="intro-loading"></div>

</div>



<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login-page">

  <div class="login-background">

    <div class="login-stars"></div>

    <div class="login-cloud one"></div>

    <div class="login-cloud two"></div>
    <div class="forgot-password">
    <a href="forgot-password.html">
        Forgot Password?
    </a>
</div>


    <svg
      class="login-route"
      viewBox="0 0 1600 900"
      preserveAspectRatio="xMidYMid slice"
    >

      <path
        d="M70 770 C400 350 1000 300 1530 110"
        fill="none"
        stroke="rgba(255,255,255,.45)"
        stroke-width="3"
        stroke-dasharray="2 16"
        stroke-linecap="round"
      />

      <circle
        cx="70"
        cy="770"
        r="9"
        fill="#ff7a59"
      />

      <circle
        cx="1530"
        cy="110"
        r="9"
        fill="#22d3ee"
      />

    </svg>


    <div class="login-mountains"></div>


    <div class="login-road">

      <div class="bus">
        🚌
      </div>

      <div class="car">
        🚗
      </div>

    </div>

  </div>



  <!-- LOGIN CARD -->

  <div class="login-card">

    <div class="logo">
      🌍
    </div>

    <h1>
      GlobeTrotter
    </h1>

    <p class="subtitle">
      Plan multi-city trips, on budget, together.
    </p>


    <div class="mini-route">

      <div class="route-dot start"></div>

      <div class="route-line"></div>

      <div class="route-icon">
        ✈️
      </div>

      <div class="route-line"></div>

      <div class="route-dot end"></div>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message hidden"
    ></div>


    <!-- =========================
         LOGIN FORM
    ========================== -->

    <form id="loginForm">

      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          required
        >

      </div>


      <button
        class="login-btn"
        type="submit"
      >
        Login & Continue ✈
      </button>


      <p class="forgot">

        <a
          href="#"
          id="forgot"
        >
          Forgot Password?
        </a>

      </p>

    </form>


    <!-- =========================
         SIGNUP FORM
    ========================== -->

    <a href="registration.html">
    Sign up
</a>





    


    

  </div>

</div>



<script>

/* =========================================
   STORAGE KEYS
========================================= */

const USERS_KEY =
  "globetrotter_users";

const TOKEN_KEY =
  "globetrotter_token";

const USER_KEY =
  "globetrotter_user";


/* =========================================
   ELEMENTS
========================================= */

const message =
  document.getElementById("message");

const loginForm =
  document.getElementById("loginForm");

const signupForm =
  document.getElementById("signupForm");

const switchLink =
  document.getElementById("switchLink");

const switchText =
  document.getElementById("switchText");


/* =========================================
   USERS
========================================= */

function getUsers(){

  try{

    return JSON.parse(
      localStorage.getItem(
        USERS_KEY
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveUsers(users){

  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );

}


/* =========================================
   TOKEN
========================================= */

function makeToken(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return (
    "token-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type="error"
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =========================================
   CREATE ADMIN
========================================= */

function createAdmin(){

  const users =
    getUsers();

  const exists =
    users.some(
      user =>
        user.email.toLowerCase() ===
        "admin@globetrotter.test"
    );


  if(!exists){

    users.push({

      id:"admin",

      name:"Demo Admin",

      email:
        "admin@globetrotter.test",

      password:
        "admin123",

      role:"admin"

    });

    saveUsers(users);

  }

}

createAdmin();


/* =========================================
   LOGIN / SIGNUP SWITCH
========================================= */

let loginMode = true;


switchLink.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    loginMode =
      !loginMode;


    loginForm.classList.toggle(
      "hidden",
      !loginMode
    );


    signupForm.classList.toggle(
      "hidden",
      loginMode
    );


    switchLink.textContent =
      loginMode
        ? "Sign up"
        : "Log in";


    switchText.textContent =
      loginMode
        ? "Don't have an account?"
        : "Already have an account?";


    message.classList.add(
      "hidden"
    );

  }
);


/* =========================================
   FORGOT PASSWORD
========================================= */

document
  .getElementById("forgot")
  .addEventListener(
    "click",
    function(e){

      e.preventDefault();

      showMessage(
        "Password reset is not available in this demo. Please create a new account."
      );

    }
  );


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  function(e){

    e.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const users =
      getUsers();


    const user =
      users.find(
        item =>
          item.email.toLowerCase() ===
            email.toLowerCase() &&
          item.password === password
      );


    /* INVALID */

    if(!user){

      showMessage(
        "Invalid email or password."
      );

      return;

    }


    /* =====================================
       SAVE LOGIN SESSION
    ===================================== */

    localStorage.setItem(
      TOKEN_KEY,
      makeToken()
    );


    localStorage.setItem(
      USER_KEY,
      JSON.stringify({

        id:user.id,

        name:user.name,

        email:user.email,

        role:user.role

      })
    );


    /* =====================================
       SUCCESS
    ===================================== */

    showMessage(
      "Login successful! Opening dashboard...",
      "success"
    );


    /*
      ⭐ IMPORTANT CONNECTION

      index.html
           ↓
      successful login
           ↓
      dashboard.html
    */

    setTimeout(
      function(){

        /*
          Admin login
          → Admin Analytics
        */

        if(user.role === "admin"){

          window.location.href =
            "admin-analytics.html";

        }

        /*
          Normal user
          → Main Dashboard
        */

        else{

          window.location.href =
            "dashboard.html";

        }

      },
      700
    );

  }
);


/* =========================================
   SIGNUP
========================================= */

signupForm.addEventListener(
  "submit",
  function(e){

    e.preventDefault();


    const name =
      document
        .getElementById("signupName")
        .value
        .trim();


    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("signupPassword")
        .value;


    if(
      !name ||
      !email ||
      !password
    ){

      showMessage(
        "Please fill all fields."
      );

      return;

    }


    if(password.length < 6){

      showMessage(
        "Password must be at least 6 characters."
      );

      return;

    }


    const users =
      getUsers();


    const exists =
      users.some(
        user =>
          user.email.toLowerCase() ===
          email.toLowerCase()
      );


    if(exists){

      showMessage(
        "An account with this email already exists."
      );

      return;

    }


    const newUser = {

      id:
        "user-" +
        Date.now(),

      name:name,

      email:email,

      password:password,

      role:"user"

    };


    users.push(
      newUser
    );


    saveUsers(users);


    /* =====================================
       AUTO LOGIN AFTER SIGNUP
    ===================================== */

    localStorage.setItem(
      TOKEN_KEY,
      makeToken()
    );


    localStorage.setItem(
      USER_KEY,
      JSON.stringify({

        id:newUser.id,

        name:newUser.name,

        email:newUser.email,

        role:"user"

      })
    );


    showMessage(
      "Account created! Opening dashboard...",
      "success"
    );


    /*
      ⭐ SIGNUP → DASHBOARD
    */

    setTimeout(
      function(){

        window.location.href =
          "dashboard.html";

      },
      700
    );

  }
);

</script>
